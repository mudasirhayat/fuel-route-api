<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    .panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); border-radius: 8px;
      padding: 14px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
      max-width: 320px; font-size: 14px; line-height: 1.5;
    }
    .panel h1 { font-size: 15px; margin: 0 0 6px; }
    .panel .total { font-size: 20px; font-weight: 700; color: #0a7d38; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Route summary</h1>
    <div class="total">${{ payload.summary.total_fuel_cost_usd }}</div>
    <div>{{ payload.summary.distance_miles }} miles,
         {{ payload.summary.stop_count }} fuel stop{{ payload.summary.stop_count|pluralize }},
         {{ payload.summary.total_gallons_purchased }} gal purchased</div>
  </div>
  {{ payload|json_script:"payload" }}
  <script>
    const data = JSON.parse(document.getElementById("payload").textContent);
    const map = L.map("map");
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 20,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    const line = L.polyline(data.route, { color: "#1d5fd6", weight: 4 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [30, 30] });

    const startIcon = (color) => L.divIcon({
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>`,
      className: "", iconSize: [14, 14], iconAnchor: [7, 7],
    });

    L.marker([data.start.lat, data.start.lon], { icon: startIcon("#0a7d38") })
      .addTo(map).bindPopup(`<b>Start</b><br>${data.start.label}`);
    L.marker([data.finish.lat, data.finish.lon], { icon: startIcon("#c22") })
      .addTo(map).bindPopup(`<b>Finish</b><br>${data.finish.label}`);

    for (const stop of data.stops) {
      L.marker([stop.lat, stop.lon], { icon: startIcon("#e8890c") }).addTo(map).bindPopup(
        `<b>${stop.name}</b><br>${stop.address}, ${stop.city}, ${stop.state}` +
        `<br>Mile ${stop.route_mile} &middot; $${stop.price_per_gallon}/gal` +
        `<br>Buy ${stop.gallons_purchased} gal &rarr; <b>$${stop.fuel_cost_usd}</b>`
      );
    }
  </script>
</body>
</html>
